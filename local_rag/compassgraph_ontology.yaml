name: CompassGraph Ontology
version: 1.0
description: >
  Generic ontology for building a local GraphRAG knowledge graph from notes,
  documents, courses, research, project plans, and reusable knowledge sources.

node_types:
  Source:
    description: A document, course, book, article, note, meeting, or dataset.
    examples:
      - Sample GraphRAG Basics
      - Research Notes
      - Project Requirements

  Concept:
    description: A core idea, topic, principle, or term.
    examples:
      - Knowledge Graph
      - Semantic Search
      - Evaluation

  Framework:
    description: A reusable decision-making, analytical, or design structure.
    examples:
      - Retrieval-Augmented Generation
      - Decision Matrix
      - Experiment Design

  Method:
    description: A computational, analytical, or practical method.
    examples:
      - Chunking
      - Entity Extraction
      - Graph Traversal

  Formula:
    description: A mathematical expression, metric, or symbolic rule.
    examples:
      - Precision
      - Recall
      - Similarity Score

  CaseStudy:
    description: A concrete example, scenario, project, or incident.
    examples:
      - Sample Search Workflow
      - Failed Retrieval Example
      - Product Research Case

  Skill:
    description: A capability that can be developed or demonstrated.
    examples:
      - Prompt Design
      - Data Modeling
      - Evaluation Planning

  ProjectIdea:
    description: A project, artifact, prototype, report, or demo.
    examples:
      - Local GraphRAG Workspace
      - Knowledge Review Dashboard
      - Source Quality Audit

  Goal:
    description: A desired outcome or objective.
    examples:
      - Improve Retrieval Quality
      - Build a Reproducible Knowledge Base
      - Reduce Duplicate Notes

  Risk:
    description: A source of uncertainty, downside, or failure.
    examples:
      - Stale Source Data
      - Hallucinated Links
      - Weak Evaluation

  DecisionCriterion:
    description: A criterion used to compare options or judge quality.
    examples:
      - Evidence Strength
      - Maintainability
      - Retrieval Precision

edge_types:
  TEACHES:
    description: A source teaches a concept, framework, method, or skill.
    example: Sample GraphRAG Basics -> TEACHES -> Knowledge Graph

  DEFINES:
    description: A source or concept defines another concept.
    example: Sample GraphRAG Basics -> DEFINES -> GraphRAG

  USES:
    description: A framework, method, or concept uses another concept, formula, input, or method.
    example: Semantic Search -> USES -> Embeddings

  MEASURES:
    description: A metric, formula, or framework measures quality, performance, or risk.
    example: Precision -> MEASURES -> Retrieval Quality

  SUPPORTS:
    description: A concept, skill, source, or method supports a goal, project, or decision.
    example: Evaluation Plan -> SUPPORTS -> Retrieval Quality

  APPLIES_TO:
    description: A concept, framework, or method applies to a domain, source, project, or goal.
    example: GraphRAG -> APPLIES_TO -> Knowledge Review

  HELPS_WITH:
    description: A skill, source, framework, or method helps with a goal or project.
    example: Entity Extraction -> HELPS_WITH -> Reproducible Knowledge Base

  REQUIRES:
    description: A goal, project, method, or framework requires a skill, concept, or input.
    example: Local GraphRAG Workspace -> REQUIRES -> Data Modeling

  RELATED_TO:
    description: A general relationship between two connected ideas.
    example: Semantic Search -> RELATED_TO -> Retrieval Quality

  CONTRASTS_WITH:
    description: Two concepts are meaningfully different or opposed.
    example: Keyword Search -> CONTRASTS_WITH -> Semantic Search

  COMPLEMENTS:
    description: Two concepts, methods, or skills work well together.
    example: Vector Search -> COMPLEMENTS -> Knowledge Graph

  EVALUATES:
    description: A framework, method, metric, or checklist evaluates a target.
    example: Evaluation Plan -> EVALUATES -> Retrieval Quality

  IMPROVES:
    description: A skill, framework, or method improves another process or outcome.
    example: Better Chunking -> IMPROVES -> Semantic Search

  RISKS:
    description: A factor creates or increases a risk.
    example: Stale Source Data -> RISKS -> Answer Quality

  MITIGATES:
    description: A method, rule, or action reduces a risk.
    example: Source Review -> MITIGATES -> Stale Source Data

  PROVES:
    description: A project, evidence, or output demonstrates a skill or capability.
    example: Knowledge Review Dashboard -> PROVES -> Data Modeling

  PART_OF:
    description: A concept is part of a broader concept, framework, source, or project.
    example: Entity Extraction -> PART_OF -> GraphRAG

extraction_rules:
  - Extract relationships that are useful for retrieval, reasoning, planning, or review.
  - Prefer specific concepts over vague phrases.
  - Use stable source titles when linking source-level knowledge.
  - Do not create edges from administrative details unless they help retrieval or reasoning.
  - Normalize duplicate concepts where obvious, such as "vector search" and "semantic search".
  - Keep relationship labels from the allowed edge_types list unless a project-specific label is clearly needed.
  - Create cross-source links when two sources teach, use, or apply related concepts.
  - Create application links when a concept, skill, or method is useful for a project or goal.

priority_relationships:
  - Source -> TEACHES -> Concept
  - Source -> TEACHES -> Framework
  - Source -> TEACHES -> Method
  - Concept -> RELATED_TO -> Concept
  - Framework -> USES -> Concept
  - Method -> MEASURES -> DecisionCriterion
  - Skill -> SUPPORTS -> Goal
  - ProjectIdea -> PROVES -> Skill
  - Concept -> APPLIES_TO -> Goal
  - Method -> MITIGATES -> Risk
